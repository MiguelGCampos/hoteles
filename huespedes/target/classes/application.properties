spring.application.name=huespedes
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:XE}
spring.datasource.username=${DB_USER:system}
spring.datasource.password=${DB_PASS:1234}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true
eureka.instance.appname=huespedes

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/hotel-realm
