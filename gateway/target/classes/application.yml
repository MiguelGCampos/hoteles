server:
  port: 8090

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Cada microservicio ya expone su propio prefijo (@RequestMapping),
        # por eso aquí NO se aplica StripPrefix: el path se reenvía tal cual.
        - id: reservas
          uri: lb://reservas
          predicates:
            - Path=/api/reservas/**

        - id: habitaciones
          uri: lb://habitaciones
          predicates:
            - Path=/api/habitaciones/**

        - id: huespedes
          uri: lb://huespedes
          predicates:
            - Path=/api/huespedes/**

        # AuthController expone POST /api/login
        - id: authorization-login
          uri: lb://authorization
          predicates:
            - Path=/api/login

        # UsuarioController expone /admin/usuarios/**
        - id: authorization-usuarios
          uri: lb://authorization
          predicates:
            - Path=/admin/usuarios/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/hotel-realm

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
